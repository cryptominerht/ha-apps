name: TV Kid Lock
version: "1.3.0"
slug: tv_kidlock
description: Locks the Samsung TV after a set watch time until a quiz is answered
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true          # TV remote API + quiz page must be on the LAN
homeassistant_api: true     # talks to HA without a long-lived token
map:
  - type: addon_config      # settings, questions and results live here
    read_only: false
webui: "http://[HOST]:[PORT:5000]/parent"
options:
  tv_host: ""
  tv_port: 8002
  parent_pin: ""
  internet_block_switch: ""
  block_when: "on"
  watch_minutes: 10
  correct_to_unlock: 2
  internet_block: escape
  close_app_after_escapes: 3
  categories: []
  enable_entity: "input_boolean.tv_kid_lock"
schema:
  tv_host: str
  tv_port: port
  parent_pin: str
  internet_block_switch: str?
  block_when: list(on|off)
  watch_minutes: int(1,240)
  correct_to_unlock: int(1,10)
  internet_block: list(escape|always|never)
  close_app_after_escapes: int(0,20)
  categories:
    - str
  enable_entity: str?
  quiz_url: url?
