name: TV Kid Lock
version: "1.0.1"
slug: tv_kidlock
description: Locks the Samsung TV after a set watch time until a quiz is answered
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true          # TV remote API + quiz page must be on the LAN
homeassistant_api: true     # talks to HA without a long-lived token
map:
  - type: addon_config      # settings, questions and results live here
    read_only: false
webui: "http://[HOST]:[PORT:5000]/parent"
